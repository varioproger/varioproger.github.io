title: varioproger Docs
description: C# 게임 서버, NestJS SaaS 백엔드, Docker·Kubernetes 필수 이론 모음
theme: just-the-docs
lang: ko

url: https://varioproger.github.io

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# 문서 본문의 {{ }} / {% %} 가 Liquid 로 해석되지 않도록 한다
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "doc"
    values:
      render_with_liquid: false

# 큰 문서 목록: 목차를 접어서 보여준다
nav_sort: case_sensitive
back_to_top: true
back_to_top_text: "맨 위로"
search_enabled: true
