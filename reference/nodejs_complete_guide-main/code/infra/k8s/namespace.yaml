# 네임스페이스 (32.6절)
# 이 책의 모든 리소스는 ncg 네임스페이스 안에 만든다.
# 네임스페이스를 나누면 이름 충돌을 막고, 리소스 쿼터와 네트워크 정책을 한 번에 걸 수 있다.
apiVersion: v1
kind: Namespace
metadata:
  name: ncg
  labels:
    name: ncg
    environment: production
---
# 네임스페이스 전체 리소스 상한. 하나의 잘못된 배포가 클러스터를 다 먹는 것을 막는다
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ncg-quota
  namespace: ncg
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
---
# 컨테이너에 requests/limits 를 적지 않았을 때 적용되는 기본값.
# 제한 없는 파드가 노드를 잠식하는 사고를 막는 안전망이다
apiVersion: v1
kind: LimitRange
metadata:
  name: ncg-defaults
  namespace: ncg
spec:
  limits:
    - type: Container
      default:              # limits 기본값
        cpu: 500m
        memory: 512Mi
      defaultRequest:       # requests 기본값
        cpu: 100m
        memory: 128Mi
