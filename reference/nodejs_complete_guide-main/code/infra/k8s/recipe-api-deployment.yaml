# recipe-api Deployment (32.9 스케일링·롤링 업데이트 / 32.10 컨테이너 안의 Node.js 대응)
#
# 이 매니페스트의 거의 모든 줄에는 이유가 있다. 주석으로 그 이유를 남겼다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-api
  namespace: ncg
  labels:
    app: recipe-api
    tier: backend
spec:
  replicas: 3          # HPA 를 붙이면 이 값은 초기값으로만 쓰이고 이후 HPA 가 관리한다

  # 롤링 업데이트 중에도 유지할 이전 리비전 수. 롤백 대상을 남겨 둔다
  revisionHistoryLimit: 5

  # 파드가 Ready 가 된 뒤 이 시간 동안 죽지 않아야 "사용 가능"으로 친다.
  # 0 이면 Ready 직후 다음 파드를 교체하기 시작해, 뜨자마자 죽는 버전이 전체로 퍼질 수 있다
  minReadySeconds: 10

  # 진행이 멈췄다고 판단하는 시간. 넘으면 Deployment 가 Progressing=False 로 표시된다
  progressDeadlineSeconds: 300

  selector:
    matchLabels:
      app: recipe-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable 0 + maxSurge 1 → 새 파드가 Ready 가 된 뒤에야 옛 파드를 내린다.
      # 무중단 배포의 기본 조합이다. 노드 여유가 없으면 maxSurge 를 낮추고 maxUnavailable 을 1 로 둔다
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: recipe-api
        tier: backend
      annotations:
        # Prometheus 가 파드를 직접 스크레이프하도록 알린다 (30장)
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
        # ConfigMap 이 바뀌면 이 체크섬을 바꿔 롤링 재시작을 유도하는 관례
        # checksum/config: "<configmap 해시>"
    spec:
      # --- 종료 유예 시간 (29.1·32.10절) ---
      # 삭제 요청 → preStop 훅 실행 → SIGTERM → (여기 시간이 지나면) SIGKILL.
      # preStop 5초 + 앱의 SHUTDOWN_TIMEOUT_MS 15초보다 넉넉하게 30초를 준다.
      # 이 값이 앱의 종료 시간보다 짧으면 진행 중인 요청이 잘려 나간다
      terminationGracePeriodSeconds: 30

      # 이미지 풀 시크릿 (프라이빗 레지스트리를 쓸 때)
      # imagePullSecrets:
      #   - name: ncg-registry

      # 파드를 여러 노드에 흩뿌린다. 한 노드가 죽어도 전체가 함께 죽지 않는다
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: recipe-api

      securityContext:
        runAsNonRoot: true       # root 로 도는 컨테이너를 거부한다
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: recipe-api
          image: registry.example.com/ncg/recipe-api:1.0.0   # latest 는 쓰지 않는다. 롤백 대상이 불명확해진다
          imagePullPolicy: IfNotPresent

          ports:
            - name: http          # 이름을 붙이면 Service 와 probe 에서 숫자 대신 참조할 수 있다
              containerPort: 4000
              protocol: TCP

          #-------------------------------------------------------------------
          # 리소스 (32.10절)
          #
          # requests : 스케줄러가 노드를 고를 때 쓰는 값이자 보장량
          # limits   : 넘으면 CPU 는 스로틀링, 메모리는 OOMKill
          #
          # CPU limit 을 너무 낮게 잡으면 Node.js 의 GC 스레드와 libuv 스레드풀이
          # 스로틀링에 걸려 응답 지연의 꼬리가 길어진다. limit 을 아예 두지 않는 선택도 있다.
          #-------------------------------------------------------------------
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          env:
            #-----------------------------------------------------------------
            # 힙 상한을 메모리 limit 에 맞춘다 (32.10절의 핵심)
            #
            # V8 의 기본 힙 상한은 컨테이너 limit 이 아니라 "호스트 물리 메모리"를 보고 정해진다.
            # 64GB 노드에서 512Mi limit 을 준 컨테이너의 기본 힙 상한은 수 GB 가 되고,
            # V8 은 아직 여유가 있다고 판단해 GC 를 미루다가 cgroup limit 을 먼저 넘겨
            # 예고 없이 OOMKilled 된다. 힙이 아니라 컨테이너가 죽으므로 힙 스냅샷도 남지 않는다.
            #
            # 그래서 limit(512Mi)의 약 75%인 384MB 를 힙 상한으로 명시한다.
            # 나머지 128MB 는 Buffer(힙 밖), 네이티브 스택, 스레드풀, V8 코드 영역 몫이다.
            # limit 을 바꾸면 이 값도 함께 바꿔야 한다.
            #-----------------------------------------------------------------
            - name: NODE_OPTIONS
              value: "--max-old-space-size=384"

            # UV 스레드풀 크기. fs·dns·zlib·crypto 가 이 풀을 공유한다.
            # CPU limit 이 1 코어이므로 기본값 4 를 유지한다(늘리면 스로틀링만 심해진다)
            - name: UV_THREADPOOL_SIZE
              value: "4"

            # 파드 자신의 정보를 환경 변수로 받는다. 로그와 트레이스에 실어 두면
            # 어느 인스턴스에서 난 문제인지 추적할 수 있다 (31장)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # 컨테이너에 실제로 걸린 메모리 limit 을 앱이 읽을 수 있게 한다
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: recipe-api
                  resource: limits.memory
            - name: OTEL_SERVICE_NAME
              value: "recipe-api"

          envFrom:
            - configMapRef:
                name: ncg-config
            - secretRef:
                name: ncg-secrets

          #-------------------------------------------------------------------
          # startupProbe (32.9절)
          #
          # 부팅이 느린 앱에서 liveness 가 먼저 실패해 무한 재시작 루프에 빠지는 것을 막는다.
          # startupProbe 가 성공하기 전까지 liveness/readiness 는 아예 실행되지 않는다.
          # 허용 부팅 시간 = periodSeconds × failureThreshold = 5초 × 24 = 120초
          #-------------------------------------------------------------------
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3

          #-------------------------------------------------------------------
          # livenessProbe — "프로세스가 되살릴 수 없는 상태인가"
          #
          # 실패하면 컨테이너를 재시작한다. 그래서 의존성(DB, Redis) 상태를 여기서 확인하면 안 된다.
          # DB 가 잠깐 흔들릴 때 멀쩡한 앱 파드가 전부 재시작되면 장애가 증폭된다.
          # /health/live 는 이벤트 루프가 살아 있는지만 확인하는 가벼운 핸들러여야 한다.
          #
          # failureThreshold 3 × period 10s → 최대 30초 뒤 재시작
          #-------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          #-------------------------------------------------------------------
          # readinessProbe — "지금 트래픽을 받아도 되는가"
          #
          # 실패해도 재시작하지 않고 Service 의 엔드포인트에서만 빠진다.
          # 여기서는 DB·Redis 연결 같은 의존성을 확인해도 된다(오히려 확인해야 한다).
          # 종료 시작 시 앱이 이 엔드포인트를 먼저 503 으로 바꿔야 트래픽이 끊긴다.
          #
          # failureThreshold 2 × period 5s → 10초 안에 로테이션에서 빠진다
          #-------------------------------------------------------------------
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1

          lifecycle:
            #-----------------------------------------------------------------
            # preStop 훅 (29.1·32.10절)
            #
            # 파드 삭제는 두 가지가 "동시에" 일어난다:
            #   (1) kubelet 이 컨테이너에 SIGTERM 을 보낸다
            #   (2) 엔드포인트 컨트롤러가 파드를 Service 에서 제거하고, 그 변경이
            #       kube-proxy / 인그레스로 전파된다
            #
            # (2)는 비동기라 수 초 늦는다. preStop 없이 SIGTERM 을 바로 받으면
            # 아직 이 파드로 오고 있는 요청이 연결 거부를 맞는다.
            # sleep 5 로 SIGTERM 을 5초 미뤄 (2)가 끝날 시간을 벌어 준다.
            #
            # 주의: 이 sleep 은 terminationGracePeriodSeconds(30초) 안에서 소비된다.
            # 앱에 남는 시간은 30 - 5 = 25초다.
            # distroless 처럼 셸이 없는 이미지에서는 sleep 바이너리가 없으므로
            # httpGet 훅을 쓰거나 K8s 1.30+ 의 `sleep` 훅 타입을 쓴다.
            #-----------------------------------------------------------------
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true    # 쓰기가 필요한 곳은 아래 emptyDir 로 따로 마운트한다
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # 힙 스냅샷·프로파일 산출물을 쓰는 위치 (34장 디버깅)
            - name: diagnostics
              mountPath: /diagnostics

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: diagnostics
          emptyDir:
            sizeLimit: 512Mi
---
# PodDisruptionBudget — 노드 드레이닝(업그레이드 등) 중에도 최소 가용 파드 수를 보장한다.
# 이게 없으면 클러스터 관리자가 노드를 비울 때 recipe-api 파드가 한꺼번에 사라질 수 있다
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recipe-api-pdb
  namespace: ncg
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: recipe-api
