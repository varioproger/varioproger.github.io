# Grafana 데이터소스 자동 프로비저닝 (30장)
#
# 이 파일은 /etc/grafana/provisioning/datasources 에 마운트되며,
# Grafana 는 기동할 때 이 디렉터리를 읽어 데이터소스를 자동 등록한다.
# UI 에서 손으로 추가할 필요가 없고, 컨테이너를 지웠다 다시 만들어도 그대로 살아난다.

apiVersion: 1

# 이름이 겹칠 때 기존 데이터소스를 지우고 다시 만들도록 명시한다
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy          # 브라우저가 아니라 Grafana 서버가 대신 질의한다(CORS 회피)
    orgId: 1
    uid: ncg-prometheus    # 대시보드 JSON 에서 이 uid 로 데이터소스를 참조한다
    # 컨테이너 네트워크 안이므로 서비스 이름으로 접근한다
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST     # 긴 쿼리가 URL 길이 제한에 걸리지 않게 POST 를 쓴다
      timeInterval: 15s    # prometheus.yml 의 scrape_interval 과 맞춘다
      queryTimeout: 60s
      exemplarTraceIdDestinations:
        # 메트릭의 exemplar 에 붙은 trace_id 를 Jaeger 로 연결한다(31장)
        - name: trace_id
          datasourceUid: ncg-jaeger

  - name: Jaeger
    type: jaeger
    access: proxy
    orgId: 1
    uid: ncg-jaeger
    url: http://jaeger:16686
    isDefault: false
    editable: true
