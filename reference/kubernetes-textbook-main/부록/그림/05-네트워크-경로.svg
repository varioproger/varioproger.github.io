<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Apple SD Gothic Neo','Nanum Gothic',sans-serif">
  <style>
    .bg   { fill:#ffffff; }
    .ttl  { font-size:15px; font-weight:700; fill:#243447; }
    .sub  { font-size:11px; fill:#5c6b7a; }
    .zone { fill:#f7f9fc; stroke:#c8d3e0; stroke-width:1.2; rx:9; }
    .zt   { font-size:12px; font-weight:700; fill:#42536a; }
    .box  { fill:#ffffff; stroke:#5b7fa6; stroke-width:1.6; rx:7; }
    .virt { fill:#fff7ed; stroke:#c98a34; stroke-width:1.8; rx:7; stroke-dasharray:5 3; }
    .pod  { fill:#eef5ee; stroke:#5e8f5e; stroke-width:1.5; rx:6; }
    .node { fill:#fbfaf6; stroke:#ddd3bd; stroke-width:1.4; rx:8; }
    .n    { font-size:12px; font-weight:600; fill:#1f2d3d; }
    .d    { font-size:10px; fill:#5c6b7a; }
    .flow { stroke:#3f6f9e; stroke-width:2.2; fill:none; }
    .lbl  { font-size:10px; fill:#42536a; }
    .warn { font-size:10.5px; fill:#a05252; font-weight:600; }
    .mono { font-family:monospace; font-size:10.5px; fill:#42536a; }
  </style>
  <rect class="bg" x="0" y="0" width="980" height="640"/>

  <text class="ttl" x="24" y="30">트래픽이 사용자에게서 컨테이너까지 도달하는 경로</text>
  <text class="sub" x="24" y="48">진단할 때는 이 순서를 거꾸로 짚어 내려간다. 어느 단계에서 끊기는지가 원인의 위치다.</text>

  <!-- 외부 -->
  <rect class="box" x="24" y="72" width="150" height="52"/>
  <text class="n" x="99" y="94" text-anchor="middle">사용자 / 인터넷</text>
  <text class="d" x="99" y="111" text-anchor="middle">app.example.com</text>

  <!-- LB -->
  <rect class="box" x="220" y="72" width="170" height="52"/>
  <text class="n" x="305" y="94" text-anchor="middle">클라우드 로드밸런서</text>
  <text class="d" x="305" y="111" text-anchor="middle">Service type=LoadBalancer</text>

  <!-- Ingress -->
  <rect class="box" x="436" y="72" width="200" height="52"/>
  <text class="n" x="536" y="94" text-anchor="middle">Ingress Controller</text>
  <text class="d" x="536" y="111" text-anchor="middle">호스트·경로 라우팅 · TLS 종료</text>

  <!-- Service -->
  <rect class="virt" x="682" y="72" width="274" height="52"/>
  <text class="n" x="819" y="94" text-anchor="middle">Service (ClusterIP 10.96.x.x)</text>
  <text class="d" x="819" y="111" text-anchor="middle">실재하지 않는 가상 IP</text>

  <path class="flow" d="M174 98 L220 98" marker-end="url(#af)"/>
  <path class="flow" d="M390 98 L436 98" marker-end="url(#af)"/>
  <path class="flow" d="M636 98 L682 98" marker-end="url(#af)"/>

  <!-- 가상 IP 설명 -->
  <rect class="zone" x="24" y="148" width="932" height="118"/>
  <text class="zt" x="44" y="170">ClusterIP 의 정체 — 어느 인터페이스에도 붙어 있지 않다</text>
  <text class="d" x="44" y="192">Service IP 로 ping 을 보내면 응답이 없다. 그런 IP 를 가진 장비가 존재하지 않기 때문이다.</text>
  <text class="d" x="44" y="210">각 노드의 kube-proxy 가 만들어 둔 규칙이 그 IP 로 향하는 패킷을 실제 Pod IP 로 바꿔치기할 뿐이다.</text>

  <rect class="box" x="44" y="222" width="284" height="32"/>
  <text class="mono" x="186" y="243" text-anchor="middle">KUBE-SERVICES → KUBE-SVC-xxx</text>
  <rect class="box" x="348" y="222" width="284" height="32"/>
  <text class="mono" x="490" y="243" text-anchor="middle">확률 분배 → KUBE-SEP-xxx</text>
  <rect class="box" x="652" y="222" width="284" height="32"/>
  <text class="mono" x="794" y="243" text-anchor="middle">DNAT → 10.244.1.5:8080</text>
  <path class="flow" d="M328 238 L348 238" marker-end="url(#af)"/>
  <path class="flow" d="M632 238 L652 238" marker-end="url(#af)"/>

  <path class="flow" d="M819 124 L819 148" marker-end="url(#af)"/>

  <!-- 노드 영역 -->
  <rect class="zone" x="24" y="288" width="932" height="240"/>
  <text class="zt" x="44" y="310">노드와 Pod — 실제 목적지</text>

  <rect class="node" x="44" y="326" width="284" height="180"/>
  <text class="n" x="186" y="348" text-anchor="middle">노드 A</text>
  <rect class="box" x="60" y="360" width="252" height="34"/>
  <text class="n" x="186" y="381" text-anchor="middle">kube-proxy (iptables / IPVS / eBPF)</text>
  <rect class="pod" x="60" y="404" width="118" height="86"/>
  <text class="n" x="119" y="426" text-anchor="middle">Pod</text>
  <text class="d" x="119" y="444" text-anchor="middle">10.244.1.5</text>
  <text class="d" x="119" y="462" text-anchor="middle">app=web</text>
  <text class="d" x="119" y="480" text-anchor="middle">Ready ✓</text>
  <rect class="pod" x="194" y="404" width="118" height="86"/>
  <text class="n" x="253" y="426" text-anchor="middle">Pod</text>
  <text class="d" x="253" y="444" text-anchor="middle">10.244.1.6</text>
  <text class="d" x="253" y="462" text-anchor="middle">app=web</text>
  <text class="warn" x="253" y="480" text-anchor="middle">Ready ✗ 제외됨</text>

  <rect class="node" x="348" y="326" width="284" height="180"/>
  <text class="n" x="490" y="348" text-anchor="middle">노드 B</text>
  <rect class="box" x="364" y="360" width="252" height="34"/>
  <text class="n" x="490" y="381" text-anchor="middle">kube-proxy (iptables / IPVS / eBPF)</text>
  <rect class="pod" x="364" y="404" width="118" height="86"/>
  <text class="n" x="423" y="426" text-anchor="middle">Pod</text>
  <text class="d" x="423" y="444" text-anchor="middle">10.244.2.4</text>
  <text class="d" x="423" y="462" text-anchor="middle">app=web</text>
  <text class="d" x="423" y="480" text-anchor="middle">Ready ✓</text>
  <rect class="pod" x="498" y="404" width="118" height="86"/>
  <text class="n" x="557" y="426" text-anchor="middle">Pod</text>
  <text class="d" x="557" y="444" text-anchor="middle">10.244.2.5</text>
  <text class="d" x="557" y="462" text-anchor="middle">app=web</text>
  <text class="d" x="557" y="480" text-anchor="middle">Ready ✓</text>

  <!-- EndpointSlice -->
  <rect class="box" x="652" y="326" width="284" height="180"/>
  <text class="n" x="794" y="348" text-anchor="middle">EndpointSlice</text>
  <text class="d" x="668" y="372">Service 의 셀렉터에 맞고</text>
  <text class="d" x="668" y="390">Ready 인 Pod 만 목록에 오른다</text>
  <text class="mono" x="668" y="416">10.244.1.5:8080 &#160;ready ✓</text>
  <text class="mono" x="668" y="436">10.244.2.4:8080 &#160;ready ✓</text>
  <text class="mono" x="668" y="456">10.244.2.5:8080 &#160;ready ✓</text>
  <text class="warn" x="668" y="482">readiness 프로브가 트래픽을 결정한다</text>

  <path class="flow" d="M794 254 L794 326" marker-end="url(#af)"/>
  <path class="flow" d="M652 432 L616 432" marker-end="url(#af)"/>
  <path class="flow" d="M700 506 L700 518 L119 518 L119 492" marker-end="url(#af)"/>

  <!-- 진단 순서 -->
  <rect class="zone" x="24" y="548" width="932" height="70"/>
  <text class="zt" x="44" y="570">진단은 안쪽에서 바깥으로</text>
  <text class="mono" x="44" y="592">① 컨테이너 안 localhost:8080 &#160;→ ② Pod IP 직접 &#160;→ ③ ClusterIP &#160;→ ④ DNS 이름 &#160;→ ⑤ Ingress &#160;→ ⑥ 외부 도메인</text>
  <text class="d"    x="44" y="610">①만 실패=앱 · ②실패=CNI/NetworkPolicy · ③실패=kube-proxy/엔드포인트 · ④실패=CoreDNS · ⑤실패=인그레스 · ⑥실패=외부 LB/DNS</text>

  <defs>
    <marker id="af" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#3f6f9e"/></marker>
  </defs>
</svg>
