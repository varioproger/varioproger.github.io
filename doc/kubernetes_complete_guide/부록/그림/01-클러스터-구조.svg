<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" width="980" height="660" font-family="'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Apple SD Gothic Neo','Nanum Gothic',sans-serif">
  <style>
    .bg    { fill:#ffffff; }
    .zone  { fill:#f7f9fc; stroke:#c8d3e0; stroke-width:1.5; rx:10; }
    .zone2 { fill:#fbfaf6; stroke:#ddd3bd; stroke-width:1.5; rx:10; }
    .box   { fill:#ffffff; stroke:#5b7fa6; stroke-width:1.6; rx:7; }
    .box2  { fill:#ffffff; stroke:#a8874e; stroke-width:1.6; rx:7; }
    .store { fill:#fff7ed; stroke:#c98a34; stroke-width:1.8; rx:7; }
    .pod   { fill:#eef5ee; stroke:#6a9a6a; stroke-width:1.4; rx:5; }
    .ttl   { font-size:15px; font-weight:700; fill:#243447; }
    .zt    { font-size:13px; font-weight:700; fill:#4a5a6e; letter-spacing:.5px; }
    .n     { font-size:12.5px; font-weight:600; fill:#1f2d3d; }
    .d     { font-size:10.5px; fill:#5c6b7a; }
    .dz    { font-size:10px; fill:#7b8794; }
    .ln    { stroke:#8b9bb0; stroke-width:1.6; fill:none; }
    .ln2   { stroke:#c98a34; stroke-width:1.8; fill:none; }
    .lbl   { font-size:10px; fill:#6b7a8c; }
  </style>
  <rect class="bg" x="0" y="0" width="980" height="660"/>

  <text class="ttl" x="24" y="30">쿠버네티스 클러스터 구조</text>
  <text class="d"   x="24" y="48">모든 통신은 kube-apiserver를 거친다. 컴포넌트끼리 직접 대화하지 않는다.</text>

  <!-- 사용자 -->
  <rect class="box" x="24" y="70" width="150" height="52"/>
  <text class="n" x="99" y="92" text-anchor="middle">kubectl / CI / SDK</text>
  <text class="d" x="99" y="109" text-anchor="middle">클라이언트</text>

  <!-- 컨트롤 플레인 존 -->
  <rect class="zone" x="220" y="66" width="500" height="286"/>
  <text class="zt" x="240" y="90">컨트롤 플레인 (Control Plane) — 결정하는 쪽</text>

  <rect class="box" x="244" y="104" width="200" height="60"/>
  <text class="n" x="344" y="127" text-anchor="middle">kube-apiserver</text>
  <text class="d" x="344" y="145" text-anchor="middle">유일한 관문 · 인증/인가/어드미션</text>

  <rect class="store" x="480" y="104" width="216" height="60"/>
  <text class="n" x="588" y="127" text-anchor="middle">etcd</text>
  <text class="d" x="588" y="145" text-anchor="middle">모든 상태의 저장소 (Raft)</text>

  <rect class="box" x="244" y="186" width="200" height="60"/>
  <text class="n" x="344" y="209" text-anchor="middle">kube-scheduler</text>
  <text class="d" x="344" y="227" text-anchor="middle">Pod를 어느 노드에 둘지 결정</text>

  <rect class="box" x="480" y="186" width="216" height="60"/>
  <text class="n" x="588" y="209" text-anchor="middle">kube-controller-manager</text>
  <text class="d" x="588" y="227" text-anchor="middle">수십 개 컨트롤러의 조정 루프</text>

  <rect class="box" x="244" y="268" width="452" height="56"/>
  <text class="n" x="470" y="291" text-anchor="middle">cloud-controller-manager (클라우드 환경)</text>
  <text class="d" x="470" y="309" text-anchor="middle">노드 정보 보강 · LoadBalancer 생성 · 라우트 설정</text>

  <!-- 클라이언트 → apiserver -->
  <path class="ln" d="M174 96 L244 130" marker-end="url(#ar)"/>
  <text class="lbl" x="180" y="90">HTTPS</text>

  <!-- apiserver ↔ etcd -->
  <path class="ln2" d="M444 134 L480 134" marker-end="url(#ar2)"/>
  <path class="ln2" d="M480 148 L444 148" marker-end="url(#ar2)"/>
  <text class="lbl" x="447" y="172" text-anchor="middle">읽기/쓰기</text>

  <!-- scheduler / cm ↔ apiserver -->
  <path class="ln" d="M300 186 L300 164" marker-end="url(#ar)"/>
  <path class="ln" d="M560 186 L400 164" marker-end="url(#ar)"/>

  <!-- 워커 노드 존 -->
  <rect class="zone2" x="24" y="376" width="932" height="256"/>
  <text class="zt" x="44" y="400">워커 노드 (Worker Nodes) — 실행하는 쪽</text>

  <!-- 노드 1 -->
  <rect class="box2" x="44" y="414" width="286" height="198"/>
  <text class="n" x="187" y="436" text-anchor="middle">노드 1</text>
  <rect class="box" x="60" y="448" width="120" height="42"/>
  <text class="n" x="120" y="466" text-anchor="middle">kubelet</text>
  <text class="dz" x="120" y="481" text-anchor="middle">노드의 에이전트</text>
  <rect class="box" x="194" y="448" width="120" height="42"/>
  <text class="n" x="254" y="466" text-anchor="middle">kube-proxy</text>
  <text class="dz" x="254" y="481" text-anchor="middle">Service 규칙</text>
  <rect class="box" x="60" y="500" width="254" height="36"/>
  <text class="n" x="187" y="523" text-anchor="middle">컨테이너 런타임 (containerd / CRI-O)</text>
  <rect class="pod" x="60" y="546" width="76" height="50"/>
  <text class="n" x="98" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="98" y="583" text-anchor="middle">컨테이너</text>
  <rect class="pod" x="149" y="546" width="76" height="50"/>
  <text class="n" x="187" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="187" y="583" text-anchor="middle">컨테이너</text>
  <rect class="pod" x="238" y="546" width="76" height="50"/>
  <text class="n" x="276" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="276" y="583" text-anchor="middle">컨테이너</text>

  <!-- 노드 2 -->
  <rect class="box2" x="348" y="414" width="286" height="198"/>
  <text class="n" x="491" y="436" text-anchor="middle">노드 2</text>
  <rect class="box" x="364" y="448" width="120" height="42"/>
  <text class="n" x="424" y="466" text-anchor="middle">kubelet</text>
  <text class="dz" x="424" y="481" text-anchor="middle">노드의 에이전트</text>
  <rect class="box" x="498" y="448" width="120" height="42"/>
  <text class="n" x="558" y="466" text-anchor="middle">kube-proxy</text>
  <text class="dz" x="558" y="481" text-anchor="middle">Service 규칙</text>
  <rect class="box" x="364" y="500" width="254" height="36"/>
  <text class="n" x="491" y="523" text-anchor="middle">컨테이너 런타임 (containerd / CRI-O)</text>
  <rect class="pod" x="364" y="546" width="76" height="50"/>
  <text class="n" x="402" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="402" y="583" text-anchor="middle">컨테이너</text>
  <rect class="pod" x="453" y="546" width="76" height="50"/>
  <text class="n" x="491" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="491" y="583" text-anchor="middle">컨테이너</text>

  <!-- 노드 3 -->
  <rect class="box2" x="652" y="414" width="286" height="198"/>
  <text class="n" x="795" y="436" text-anchor="middle">노드 3</text>
  <rect class="box" x="668" y="448" width="120" height="42"/>
  <text class="n" x="728" y="466" text-anchor="middle">kubelet</text>
  <text class="dz" x="728" y="481" text-anchor="middle">노드의 에이전트</text>
  <rect class="box" x="802" y="448" width="120" height="42"/>
  <text class="n" x="862" y="466" text-anchor="middle">kube-proxy</text>
  <text class="dz" x="862" y="481" text-anchor="middle">Service 규칙</text>
  <rect class="box" x="668" y="500" width="254" height="36"/>
  <text class="n" x="795" y="523" text-anchor="middle">컨테이너 런타임 (containerd / CRI-O)</text>
  <rect class="pod" x="668" y="546" width="76" height="50"/>
  <text class="n" x="706" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="706" y="583" text-anchor="middle">컨테이너</text>
  <rect class="pod" x="757" y="546" width="76" height="50"/>
  <text class="n" x="795" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="795" y="583" text-anchor="middle">컨테이너</text>
  <rect class="pod" x="846" y="546" width="76" height="50"/>
  <text class="n" x="884" y="568" text-anchor="middle">Pod</text>
  <text class="dz" x="884" y="583" text-anchor="middle">컨테이너</text>

  <!-- kubelet → apiserver (watch, 화살표는 노드에서 위로) -->
  <path class="ln" d="M120 448 L120 366 L344 366 L344 164" marker-end="url(#ar)"/>
  <path class="ln" d="M424 448 L424 366" marker-end="url(#ar)"/>
  <path class="ln" d="M728 448 L728 366 L360 366" marker-end="url(#ar)"/>
  <text class="lbl" x="470" y="360" text-anchor="middle">kubelet이 API 서버를 watch한다 (pull 모델)</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#8b9bb0"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#c98a34"/>
    </marker>
  </defs>
</svg>
