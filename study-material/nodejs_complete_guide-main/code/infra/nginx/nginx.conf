#-------------------------------------------------------------------------------
# Nginx 설정 — HAProxy 와 같은 일을 하는 버전 (26.3절 대응)
#
# 실행 예:
#   docker run --rm -p 8081:8080 \
#     -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
#     --add-host=host.docker.internal:host-gateway nginx:1.27-alpine
#
# 전제: 호스트에서 web-api 를 3000, 3001, 3002 포트로 세 개 띄운다.
#-------------------------------------------------------------------------------

user  nginx;
worker_processes  auto;                 # 코어 수만큼 워커 프로세스를 만든다
worker_rlimit_nofile 65535;             # 워커당 파일 디스크립터 상한(연결 하나가 fd 두 개를 쓴다)

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 8192;            # 워커당 동시 연결 수. 총 상한 = worker_processes × 이 값
    multi_accept on;                    # 한 번 깨어날 때 대기 중인 연결을 모두 받는다
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- 로그 포맷 ---
    # upstream_addr / upstream_response_time 을 넣어야 어느 인스턴스가 느린지 알 수 있다
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'urt=$upstream_response_time upstream=$upstream_addr '
                      'rid=$http_x_request_id';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;                 # 정적 파일을 커널에서 바로 전송(유저 공간 복사 생략)
    tcp_nopush      on;                 # 헤더와 본문을 한 패킷으로 묶어 보낸다
    tcp_nodelay     on;                 # 반대로 작은 응답은 Nagle 알고리즘 없이 즉시 보낸다
    keepalive_timeout  65s;
    server_tokens   off;                # 응답 헤더에서 Nginx 버전을 숨긴다

    client_max_body_size 10m;           # 업로드 상한
    client_body_timeout 10s;
    client_header_timeout 10s;          # Slowloris 방어

    # --- 압축 (26.4절) ---
    gzip              on;
    gzip_vary         on;               # Vary: Accept-Encoding 을 붙여 캐시 오염을 막는다
    gzip_proxied      any;
    gzip_comp_level   5;                # 6 이상은 CPU 대비 이득이 작다
    gzip_min_length   1024;             # 1KB 미만은 압축해도 헤더 오버헤드가 더 크다
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml text/xml application/rss+xml image/svg+xml;

    #---------------------------------------------------------------------------
    # 레이트 리미팅 존 (26.5절)
    # $binary_remote_addr 는 IP 를 4바이트로 저장해 문자열보다 메모리를 덜 쓴다.
    # 10m 존이면 약 16만 개 IP 를 추적한다.
    #---------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_rate:10m rate=20r/s;   # 초당 20 요청
    limit_conn_zone $binary_remote_addr zone=api_conn:10m;              # 동시 연결 추적

    limit_req_status  429;              # 기본값은 503. 레이트 리밋임을 명확히 알린다
    limit_conn_status 429;

    #---------------------------------------------------------------------------
    # X-Forwarded-For 사슬 구성용.
    # 클라이언트가 보낸 X-Forwarded-For 뒤에 실제 접속 IP 를 이어 붙인다
    #---------------------------------------------------------------------------
    map $http_x_forwarded_for $proxy_add_xff {
        ""       $remote_addr;
        default  "$http_x_forwarded_for, $remote_addr";
    }

    # 요청 ID 가 없으면 Nginx 가 만들어 준다(31장 상관관계 ID)
    map $http_x_request_id $request_id_final {
        ""       $request_id;
        default  $http_x_request_id;
    }

    # WebSocket 업그레이드 전달용
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    #---------------------------------------------------------------------------
    # upstream — web-api 인스턴스 3개
    #---------------------------------------------------------------------------
    upstream web_api {
        # least_conn: 활성 연결이 가장 적은 서버로 보낸다(HAProxy 의 leastconn 과 동일한 의도)
        least_conn;

        # max_fails / fail_timeout: 10초 안에 3번 실패하면 10초 동안 그 서버를 제외한다.
        # 오픈소스 Nginx 에는 능동적 헬스 체크가 없어 이 수동 방식으로 대신한다.
        # (능동 체크가 필요하면 HAProxy 를 쓰거나 Nginx Plus 를 쓴다)
        server host.docker.internal:3000 max_fails=3 fail_timeout=10s weight=1;
        server host.docker.internal:3001 max_fails=3 fail_timeout=10s weight=1;
        server host.docker.internal:3002 max_fails=3 fail_timeout=10s weight=1;

        # 업스트림으로 가는 연결을 재사용한다. 요청마다 TCP 핸드셰이크를 하지 않아 지연이 준다.
        # keepalive 를 쓰려면 location 에서 proxy_http_version 1.1 과 Connection "" 이 필요하다
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # TLS 종료를 여기서 한다면(26.4절):
        # listen 8443 ssl http2;
        # ssl_certificate     /etc/nginx/certs/ncg.crt;
        # ssl_certificate_key /etc/nginx/certs/ncg.key;
        # ssl_protocols TLSv1.2 TLSv1.3;

        # 모든 프록시 요청에 공통으로 붙는 헤더
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_xff;      # 위 map 으로 사슬을 만든다
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-Id      $request_id_final;
        add_header       X-Request-Id      $request_id_final always;

        # 업스트림이 죽었을 때 다음 서버로 재시도할 조건
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        #-----------------------------------------------------------------------
        # 헬스 체크 경로 — 레이트 리미팅에서 제외한다
        #-----------------------------------------------------------------------
        location /health/ {
            access_log off;
            proxy_pass http://web_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        #-----------------------------------------------------------------------
        # SSE(Server-Sent Events) — 버퍼링 비활성화 (12장·26.3절)
        #
        # 기본 설정에서는 Nginx 가 업스트림 응답을 버퍼에 모아 두었다가 한 번에 보낸다.
        # SSE 는 이벤트가 생길 때마다 즉시 흘러가야 하므로 버퍼링을 반드시 꺼야 한다.
        # 끄지 않으면 클라이언트는 버퍼가 찰 때까지 아무 이벤트도 받지 못한다.
        #-----------------------------------------------------------------------
        location /events {
            proxy_pass http://web_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_buffering off;            # 응답 버퍼링 해제 — SSE 의 핵심
            proxy_cache off;                # 캐시도 끈다
            gzip off;                       # 압축 버퍼도 지연을 만든다
            chunked_transfer_encoding on;
            # 참고: 업스트림이 응답에 X-Accel-Buffering: no 헤더를 실어 보내면
            # Nginx 는 그 응답 하나에 대해서만 버퍼링을 끈다.
            # 경로별로 나누기 어려울 때 애플리케이션이 직접 제어하는 방법이다

            proxy_read_timeout 1h;          # 이벤트가 없어도 연결을 유지한다
            proxy_send_timeout 1h;
        }

        #-----------------------------------------------------------------------
        # WebSocket
        #-----------------------------------------------------------------------
        location /ws {
            proxy_pass http://web_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        #-----------------------------------------------------------------------
        # 일반 API 트래픽
        #-----------------------------------------------------------------------
        location / {
            # burst=40: 순간적으로 40개까지 큐에 담아 두고 nodelay 로 즉시 처리한다.
            # nodelay 가 없으면 큐에 담긴 요청이 rate 속도로 천천히 나가 지연이 커진다
            limit_req  zone=api_rate burst=40 nodelay;
            limit_conn api_conn 100;        # IP 당 동시 연결 100개

            proxy_pass http://web_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";     # upstream keepalive 를 쓰려면 비워야 한다

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            proxy_buffering on;                 # 일반 API 응답은 버퍼링이 유리하다
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
            proxy_busy_buffers_size 32k;
        }

        # 업스트림이 모두 죽었을 때 보여줄 페이지
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 503 '{"error":"service_unavailable","message":"업스트림 web-api 인스턴스가 없습니다"}';
        }
    }
}
