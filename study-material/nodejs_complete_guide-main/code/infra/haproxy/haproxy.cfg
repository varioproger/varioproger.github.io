#-------------------------------------------------------------------------------
# HAProxy 설정 — web-api 인스턴스 3개 로드 밸런싱 (26.2절 대응)
#
# 실행 예:
#   docker run --rm -p 8080:8080 -p 8404:8404 \
#     -v "$PWD/infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro" \
#     --add-host=host.docker.internal:host-gateway haproxy:2.9-alpine
#
# 전제: 호스트에서 web-api 를 PORT=3000, 3001, 3002 로 세 개 띄운다.
#   PORT=3000 node services/web-api/src/server.js   (3001, 3002 도 동일하게)
#-------------------------------------------------------------------------------

global
    log stdout format raw local0 info   # 컨테이너 표준출력으로 로그를 보낸다(도커 로그와 통합)
    maxconn 20000                       # 프로세스 전체 동시 연결 상한. ulimit -n 보다 작게 잡는다
    nbthread 4                          # 워커 스레드 수. 보통 코어 수에 맞춘다
    stats timeout 30s
    # 압축 알고리즘으로 gzip 사용을 허용한다(아래 defaults 의 compression 지시어가 실제로 켠다)
    tune.bufsize 32768                  # 헤더가 큰 요청(JWT 쿠키 등)에서 400 을 피하려면 키운다

defaults
    log     global
    mode    http                        # L7 모드. 경로/헤더 기반 라우팅과 httpchk 를 쓰려면 필수
    option  httplog                     # 요청 라인·상태코드·응답시간을 포함한 로그 포맷
    option  dontlognull                 # 헬스 체크처럼 데이터 없는 연결은 로그에서 제외
    option  http-server-close           # 클라이언트는 keep-alive, 백엔드 연결은 요청마다 닫는다.
                                        # 백엔드가 추가/제거될 때 트래픽이 빨리 재분배된다
    option  forwardfor                  # X-Forwarded-For 에 클라이언트 IP 를 추가한다
    option  redispatch                  # 고른 서버가 죽었으면 다른 서버로 즉시 재시도
    retries 3                           # 연결 실패 시 재시도 횟수

    # --- 타임아웃 ---
    timeout connect 5s                  # 백엔드 TCP 연결 수립 대기
    timeout client  60s                 # 클라이언트가 아무것도 보내지 않을 때 끊는 시간
    timeout server  60s                 # 백엔드 응답 대기. 느린 API 가 있으면 늘린다
    timeout http-request 10s            # 요청 헤더 전체를 받는 데 허용하는 시간(Slowloris 방어)
    timeout http-keep-alive 15s
    timeout queue 30s                   # maxconn 초과로 큐에서 대기하는 최대 시간
    timeout tunnel 1h                   # WebSocket/SSE 처럼 오래 열려 있는 연결용

    # --- 압축 ---
    # 텍스트 계열만 압축한다. 이미 압축된 이미지나 gzip 응답을 다시 압축하면 CPU 만 쓴다
    compression algo gzip
    compression type text/html text/plain text/css application/json application/javascript

    # --- 기본 에러 페이지 ---
    # 주의: 지정한 파일이 없으면 HAProxy 는 아예 기동하지 않는다.
    # 공식 이미지에 오류 파일이 들어 있는 위치가 버전마다 다르므로 기본값을 쓰고,
    # 직접 만든 페이지를 쓸 때만 주석을 푼다
    # errorfile 503 /usr/local/etc/haproxy/errors/503.http

#-------------------------------------------------------------------------------
# 통계 페이지 — http://localhost:8404/stats
# 어느 백엔드가 UP/DOWN 인지, 각 서버의 현재 세션 수와 큐 길이를 실시간으로 보여준다
#-------------------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s                    # 5초마다 자동 새로고침
    stats show-legends
    stats show-node
    stats admin if TRUE                 # UI 에서 서버를 수동으로 내릴 수 있게 한다(개발 전용)
    # 운영에서는 반드시 인증을 건다:
    # stats auth admin:비밀번호
    no log                              # 통계 페이지 접근은 로그에 남기지 않는다

#-------------------------------------------------------------------------------
# frontend — 클라이언트 트래픽 수신부
#-------------------------------------------------------------------------------
frontend web_api_front
    bind *:8080
    maxconn 18000                       # 이 프론트엔드가 받아들일 동시 연결 상한

    # TLS 종료를 프록시에서 하려면(26.4절):
    # bind *:8443 ssl crt /etc/haproxy/certs/ncg.pem alpn h2,http/1.1
    # http-request redirect scheme https unless { ssl_fc }

    # --- 요청 헤더 정리 ---
    # 클라이언트가 위조해 보낼 수 있는 헤더는 프록시에서 덮어쓴다
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
    http-request set-header X-Forwarded-Port %[dst_port]
    # 요청 추적용 ID. 백엔드가 없으면 만들어 주고, 있으면 그대로 전달한다(31장 상관관계 ID)
    http-request set-header X-Request-Id %[uuid()] unless { req.hdr(X-Request-Id) -m found }

    #---------------------------------------------------------------------------
    # 레이트 리미팅 — stick-table 기반 (26.5절)
    #
    # 클라이언트 IP 를 키로 하는 테이블에 10초 슬라이딩 윈도의 요청 수(http_req_rate)와
    # 오류 수(http_err_rate)를 기록한다. size 는 추적할 최대 IP 개수,
    # expire 는 마지막 요청 이후 이 시간이 지나면 항목을 지운다는 뜻이다.
    #---------------------------------------------------------------------------
    stick-table type ip size 200k expire 60s store http_req_rate(10s),http_err_rate(10s),conn_cur

    # 헬스 체크 경로는 카운트에서 제외한다(모니터링 때문에 차단되면 곤란하다)
    acl is_health path_beg /health
    http-request track-sc0 src unless is_health

    # 10초에 200회(= 초당 20회)를 넘으면 429 로 거절한다
    acl too_many_requests sc_http_req_rate(0) gt 200
    # 4xx/5xx 를 10초에 50회 넘게 유발하면 스캐너로 보고 차단한다
    acl too_many_errors   sc_http_err_rate(0) gt 50
    # 한 IP 가 동시에 100개 넘는 연결을 잡고 있으면 거절한다
    acl too_many_conns    sc_conn_cur(0) gt 100

    http-request deny deny_status 429 if too_many_requests
    http-request deny deny_status 429 if too_many_conns
    http-request silent-drop if too_many_errors   # 스캐너에는 응답조차 주지 않는다

    # 남은 허용량을 응답 헤더로 알려 준다(클라이언트가 스스로 속도를 줄일 수 있게).
    # 429 를 받은 클라이언트는 이 값을 보고 언제 다시 시도할지 판단한다
    http-response set-header X-RateLimit-Limit 200
    # 남은 횟수까지 계산해 주려면 컨버터를 이어 붙인다.
    # 컨버터 표현식은 HAProxy 버전에 따라 문법이 달라 기동 실패를 부를 수 있으니,
    # 쓰기 전에 `haproxy -c -f haproxy.cfg` 로 반드시 검증한다
    # http-response set-header X-RateLimit-Remaining %[sc_http_req_rate(0),sub(200),neg]

    # SSE/WebSocket 은 별도 백엔드로 보내 버퍼링·타임아웃을 다르게 준다
    acl is_sse path_beg /events
    acl is_ws  hdr(Upgrade) -i websocket
    use_backend web_api_stream if is_sse or is_ws

    default_backend web_api_back

#-------------------------------------------------------------------------------
# backend — web-api 인스턴스 3개
#-------------------------------------------------------------------------------
backend web_api_back
    # leastconn: 활성 연결이 가장 적은 서버로 보낸다.
    # 요청 처리 시간이 들쭉날쭉한 API 에서는 roundrobin 보다 꼬리 지연이 안정적이다
    balance leastconn

    # --- 헬스 체크 ---
    # /health/ready 가 200 을 주는 동안만 트래픽을 받는다.
    # 부팅 중이거나 DB 연결이 끊긴 인스턴스는 스스로 503 을 반환해 빠진다(29장)
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200

    # 응답에도 서버 식별자를 실어 어느 인스턴스가 처리했는지 확인할 수 있게 한다
    http-response set-header X-Served-By %s

    # --- 서버 목록 ---
    # check       : 위에 정의한 httpchk 를 이 서버에 적용
    # inter 2s    : 정상일 때 체크 간격
    # fastinter 1s: 상태가 흔들릴 때(전이 중) 더 자주 확인
    # downinter 5s: 죽은 서버는 덜 자주 확인
    # rise 2      : 연속 2회 성공하면 다시 투입
    # fall 3      : 연속 3회 실패하면 제외
    # maxconn 500 : 서버당 동시 요청 상한. 넘으면 HAProxy 가 큐에 담아 백프레셔를 만든다
    # slowstart   : 복귀 직후 30초에 걸쳐 가중치를 서서히 올린다(콜드 스타트 보호)
    server web1 host.docker.internal:3000 check inter 2s fastinter 1s downinter 5s rise 2 fall 3 maxconn 500 slowstart 30s
    server web2 host.docker.internal:3001 check inter 2s fastinter 1s downinter 5s rise 2 fall 3 maxconn 500 slowstart 30s
    server web3 host.docker.internal:3002 check inter 2s fastinter 1s downinter 5s rise 2 fall 3 maxconn 500 slowstart 30s

#-------------------------------------------------------------------------------
# backend — SSE / WebSocket 전용
# 스트리밍 응답은 버퍼링하면 안 되고, 오래 열려 있으므로 타임아웃도 길어야 한다
#-------------------------------------------------------------------------------
backend web_api_stream
    balance leastconn
    option httpchk
    http-check send meth GET uri /health/ready
    http-check expect status 200

    timeout server 1h                   # 스트림이 끊기지 않게 서버 타임아웃을 늘린다
    timeout tunnel 1h
    no option http-server-close         # 연결을 계속 열어 둔다
    option http-pretend-keepalive
    compression offload                 # 압축하지 않고 그대로 흘려보낸다(SSE 는 압축하면 지연이 생긴다)

    server web1 host.docker.internal:3000 check inter 5s
    server web2 host.docker.internal:3001 check inter 5s
    server web3 host.docker.internal:3002 check inter 5s
