# HorizontalPodAutoscaler (32.9절 스케일링)
#
# HPA 는 metrics-server 가 있어야 동작한다:
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# 중요: HPA 가 관리하는 Deployment 의 replicas 를 kubectl 로 직접 바꾸면 HPA 가 곧 되돌린다.
# 또 Deployment 매니페스트에 replicas 를 남겨 두고 GitOps 로 재적용하면 HPA 와 싸운다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-api-hpa
  namespace: ncg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-api

  minReplicas: 3      # PDB 의 minAvailable(2)보다 커야 축소 중에도 가용성이 유지된다
  maxReplicas: 20

  metrics:
    #-------------------------------------------------------------------------
    # CPU 기반 — 가장 기본적인 지표
    #
    # averageUtilization 은 "limits" 가 아니라 "requests" 대비 비율이다.
    # requests: 250m 이므로 70% = 175m 를 평균적으로 쓰면 확장한다.
    # Node.js 는 단일 스레드라 한 파드가 1코어를 넘게 못 쓰므로, CPU 사용률은
    # 이벤트 루프 포화의 대리 지표로는 꽤 잘 동작한다.
    #-------------------------------------------------------------------------
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # 메모리 기반 확장은 보통 권하지 않는다.
    # Node.js 힙은 GC 전까지 계속 차오르므로 "메모리가 높다 = 부하가 높다"가 아니다.
    # 그래도 필요하면:
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       type: Utilization
    #       averageUtilization: 80

    #-------------------------------------------------------------------------
    # 커스텀 지표 (아래는 주석 처리 — prometheus-adapter 설치가 필요하다)
    #
    # Node.js 서비스에서 CPU보다 정직한 신호는 다음 두 가지다:
    #   1) 이벤트 루프 지연 (3장 measure-lag.js 에서 측정한 그 값)
    #   2) 초당 요청 수 또는 처리 중인 요청 수
    #
    # 이벤트 루프 지연 p99 가 100ms 를 넘으면 CPU 사용률이 낮아도 사용자는 이미 느리다고 느낀다.
    # prom-client 의 nodejs_eventloop_lag_p99_seconds 를 prometheus-adapter 로
    # custom.metrics.k8s.io API 에 노출하면 아래처럼 쓸 수 있다.
    #
    # 설치:
    #   helm install prometheus-adapter prometheus-community/prometheus-adapter
    # 확인:
    #   kubectl get --raw /apis/custom.metrics.k8s.io/v1beta1 | jq
    #-------------------------------------------------------------------------
    # - type: Pods
    #   pods:
    #     metric:
    #       name: nodejs_eventloop_lag_p99_seconds
    #     target:
    #       type: AverageValue
    #       averageValue: "100m"        # 0.1초. 넘으면 확장한다
    #
    # - type: Pods
    #   pods:
    #     metric:
    #       name: http_requests_per_second
    #     target:
    #       type: AverageValue
    #       averageValue: "200"          # 파드당 초당 200 요청을 목표로 유지한다
    #
    # 외부 지표(예: RabbitMQ 큐 길이)로 워커를 확장할 수도 있다 (25장):
    # - type: External
    #   external:
    #     metric:
    #       name: rabbitmq_queue_messages_ready
    #       selector:
    #         matchLabels:
    #           queue: recipe-jobs
    #     target:
    #       type: AverageValue
    #       averageValue: "100"          # 파드당 대기 메시지 100개를 목표로

  #---------------------------------------------------------------------------
  # 스케일링 동작 — 플래핑(늘렸다 줄였다 반복) 방지
  #---------------------------------------------------------------------------
  behavior:
    scaleUp:
      # 확장은 빠르게. 부하가 튀면 30초 안에 반응한다
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100          # 한 번에 최대 2배까지
          periodSeconds: 30
        - type: Pods
          value: 4            # 또는 한 번에 최대 4개
          periodSeconds: 30
      selectPolicy: Max       # 두 정책 중 더 공격적인 쪽을 택한다

    scaleDown:
      # 축소는 느리게. 부하가 잠깐 꺼졌다고 줄였다가 다시 늘리면
      # 콜드 스타트 때문에 오히려 지연이 커진다.
      # 5분 동안 안정적으로 낮아야 줄인다
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25           # 5분에 최대 25%씩만 줄인다
          periodSeconds: 60
      selectPolicy: Min       # 보수적인 쪽을 택한다
---
# recipe-api 도 같은 방식으로 확장한다
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recipe-api-hpa
  namespace: ncg
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recipe-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
