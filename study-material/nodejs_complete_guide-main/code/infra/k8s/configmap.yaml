# ConfigMap — 비밀이 아닌 설정 (32.7절)
#
# 비밀번호·토큰은 여기 두지 않는다. Secret 으로 분리한다(secret.example.yaml 참고).
# ConfigMap 을 바꿔도 이미 떠 있는 파드의 환경 변수는 갱신되지 않는다.
# 반영하려면 `kubectl rollout restart deployment/...` 로 롤링 재시작을 해야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ncg-config
  namespace: ncg
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # 서비스 포트 — Service 의 targetPort 와 일치해야 한다
  RECIPE_API_PORT: "4000"
  WEB_API_PORT: "3000"

  # 서비스 디스커버리 (32.8절)
  # 같은 네임스페이스 안에서는 서비스 이름만으로 접근할 수 있다.
  # 전체 FQDN 은 <service>.<namespace>.svc.cluster.local 이다
  RECIPE_API_URL: "http://recipe-api.ncg.svc.cluster.local:4000"
  WEB_API_URL: "http://web-api.ncg.svc.cluster.local:3000"

  # 의존 인프라 주소
  POSTGRES_HOST: "postgres.ncg.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "ncg"
  REDIS_HOST: "redis.ncg.svc.cluster.local"
  REDIS_PORT: "6379"
  RABBITMQ_URL: "amqp://rabbitmq.ncg.svc.cluster.local:5672"

  # 관측 (30·31장)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.ncg.svc.cluster.local:4318"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"        # 운영에서는 10%만 샘플링해 비용을 줄인다
  METRICS_PATH: "/metrics"

  # 복원력 파라미터 (29장)
  HTTP_TIMEOUT_MS: "5000"
  CIRCUIT_BREAKER_THRESHOLD: "5"
  CIRCUIT_BREAKER_RESET_MS: "30000"
  RETRY_MAX_ATTEMPTS: "3"

  # 우아한 종료 (29.1·32.10절)
  # preStop 훅 5초 + 진행 중 요청 처리 여유. terminationGracePeriodSeconds 보다 작아야 한다
  SHUTDOWN_TIMEOUT_MS: "15000"
