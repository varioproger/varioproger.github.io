# Secret 예시 파일 (32.7절)
#
# 주의: 이 파일은 "예시"다. 실제 값이 든 Secret 은 절대 저장소에 커밋하지 않는다.
#   cp secret.example.yaml secret.yaml   # secret.yaml 은 .gitignore 에 있어야 한다
#
# 운영에서는 다음 중 하나를 쓴다:
#   - 클라우드 시크릿 매니저 + External Secrets Operator
#   - Sealed Secrets (공개키로 암호화해 커밋 가능한 형태로 만든다)
#   - HashiCorp Vault + Vault Agent Injector
#
# 기본 Secret 은 암호화가 아니라 base64 인코딩일 뿐이다. etcd 저장 시 암호화(EncryptionConfiguration)를
# 켜지 않으면 클러스터 관리자는 값을 그대로 볼 수 있다.
apiVersion: v1
kind: Secret
metadata:
  name: ncg-secrets
  namespace: ncg
type: Opaque
# stringData 는 평문으로 적으면 API 서버가 base64 로 변환해 준다(data 보다 읽고 쓰기 쉽다)
stringData:
  POSTGRES_USER: "ncg"
  POSTGRES_PASSWORD: "여기에-실제-비밀번호"
  REDIS_PASSWORD: "여기에-실제-비밀번호"
  RABBITMQ_USER: "ncg"
  RABBITMQ_PASSWORD: "여기에-실제-비밀번호"
  # JWT 서명 키 (17장). 최소 32바이트 랜덤 값을 쓴다:
  #   openssl rand -base64 48
  JWT_SECRET: "여기에-랜덤-48바이트"
  # 세션 쿠키 서명 키
  COOKIE_SECRET: "여기에-랜덤-32바이트"
---
# 프라이빗 레지스트리에서 이미지를 받을 때 필요한 자격 증명 (32.5절)
# 아래 명령으로 만드는 편이 손으로 적는 것보다 안전하다:
#   kubectl create secret docker-registry ncg-registry \
#     --docker-server=registry.example.com \
#     --docker-username=USER --docker-password=PASS \
#     -n ncg
apiVersion: v1
kind: Secret
metadata:
  name: ncg-registry
  namespace: ncg
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.example.com":{"username":"USER","password":"PASS","auth":"BASE64(USER:PASS)"}}}
