# Ingress — 외부 트래픽 진입점 (26장 역방향 프록시의 K8s 판)
#
# ingress-nginx 컨트롤러를 전제로 한다. 컨트롤러가 없으면 이 리소스는 아무 일도 하지 않는다.
#   설치: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/.../deploy.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ncg-ingress
  namespace: ncg
  annotations:
    # --- 프록시 동작 (26.3절 nginx.conf 와 같은 설정을 어노테이션으로 지정한다) ---
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # --- 로드 밸런싱 ---
    nginx.ingress.kubernetes.io/load-balance: "ewma"   # 응답 시간 가중 이동평균. leastconn 과 비슷한 효과
    nginx.ingress.kubernetes.io/upstream-hash-by: ""

    # --- 레이트 리미팅 (26.5절) ---
    nginx.ingress.kubernetes.io/limit-rps: "20"        # IP 당 초당 요청 수
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/limit-connections: "100"

    # --- 압축 (26.4절) ---
    nginx.ingress.kubernetes.io/enable-gzip: "true"

    # --- TLS ---
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # cert-manager 가 인증서를 자동 발급한다

    # --- 관측 (31장) ---
    nginx.ingress.kubernetes.io/enable-opentracing: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # 요청 ID 를 생성해 백엔드로 넘긴다. 로그·트레이스 상관관계의 출발점
      proxy_set_header X-Request-Id $req_id;
      add_header X-Request-Id $req_id always;
spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - api.example.com
      secretName: ncg-tls    # cert-manager 가 이 이름으로 인증서 Secret 을 만든다

  rules:
    - host: api.example.com
      http:
        paths:
          # 외부에 노출하는 것은 web-api 뿐이다.
          # recipe-api 는 내부 서비스이므로 Ingress 에 넣지 않는다
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-api
                port:
                  name: http
---
# SSE 전용 Ingress — 버퍼링을 끄고 타임아웃을 늘린다 (26.3절 nginx.conf 의 /events location 과 같은 의도)
#
# 어노테이션은 Ingress 리소스 단위로 적용되므로, 설정이 다른 경로는 리소스를 나눠야 한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ncg-ingress-sse
  namespace: ncg
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"     # SSE 의 핵심. 켜져 있으면 이벤트가 고인다
    nginx.ingress.kubernetes.io/enable-gzip: "false"       # 압축 버퍼도 지연을 만든다
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.example.com
      secretName: ncg-tls
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: web-api
                port:
                  name: http
