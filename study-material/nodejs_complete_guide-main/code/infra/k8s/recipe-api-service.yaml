# recipe-api Service (32.8절 서비스 디스커버리)
#
# ClusterIP 는 클러스터 내부에서만 접근 가능한 가상 IP 를 만든다.
# recipe-api 는 web-api 만 호출하는 내부 서비스이므로 외부에 노출하지 않는다.
# 클러스터 안에서는 http://recipe-api.ncg.svc.cluster.local:4000 으로 접근한다.
apiVersion: v1
kind: Service
metadata:
  name: recipe-api
  namespace: ncg
  labels:
    app: recipe-api
spec:
  type: ClusterIP
  selector:
    app: recipe-api          # 이 레이블을 가진 파드 중 Ready 인 것만 엔드포인트가 된다
  ports:
    - name: http
      port: 4000             # Service 포트
      targetPort: http       # Deployment 에서 이름 붙인 컨테이너 포트(4000)
      protocol: TCP

  # 파드가 종료 중일 때(Terminating) 새 연결을 주지 않되, 다른 Ready 파드가 하나도 없으면
  # 종료 중인 파드에라도 보낸다. 축소 중 순간적인 503 을 줄인다
  # (K8s 1.26+ ProxyTerminatingEndpoints)
  internalTrafficPolicy: Cluster
  sessionAffinity: None      # recipe-api 는 무상태이므로 세션 고정이 필요 없다 (29.2절)
---
# 헤드리스 서비스 — clusterIP: None
# DNS 조회 시 가상 IP 하나가 아니라 파드 IP 목록을 그대로 돌려준다.
# 클라이언트 측 로드 밸런싱이나 파드 개별 지정이 필요할 때 쓴다 (26.7절 P2P 로드 밸런싱)
apiVersion: v1
kind: Service
metadata:
  name: recipe-api-headless
  namespace: ncg
spec:
  clusterIP: None
  selector:
    app: recipe-api
  ports:
    - name: http
      port: 4000
      targetPort: http
