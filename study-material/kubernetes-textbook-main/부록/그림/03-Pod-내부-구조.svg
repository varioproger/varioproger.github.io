<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'Noto Sans KR','Malgun Gothic','Noto Sans CJK KR','Apple SD Gothic Neo','Nanum Gothic',sans-serif">
  <style>
    .bg    { fill:#ffffff; }
    .ttl   { font-size:15px; font-weight:700; fill:#243447; }
    .sub   { font-size:11px; fill:#5c6b7a; }
    .node  { fill:#fbfaf6; stroke:#ddd3bd; stroke-width:1.5; rx:10; }
    .podbx { fill:#f2f7f2; stroke:#5e8f5e; stroke-width:2; rx:10; }
    .ctr   { fill:#ffffff; stroke:#5b7fa6; stroke-width:1.6; rx:7; }
    .pause { fill:#fff7ed; stroke:#c98a34; stroke-width:1.8; rx:7; }
    .vol   { fill:#eef2f8; stroke:#7f95b3; stroke-width:1.4; rx:6; stroke-dasharray:4 3; }
    .share { fill:#e8f0e8; stroke:#5e8f5e; stroke-width:1.4; rx:6; }
    .n     { font-size:12.5px; font-weight:600; fill:#1f2d3d; }
    .d     { font-size:10.5px; fill:#5c6b7a; }
    .zt    { font-size:12.5px; font-weight:700; fill:#42536a; }
    .tag   { font-size:10px; font-weight:700; fill:#3d6b3d; }
    .tagx  { font-size:10px; font-weight:700; fill:#a05252; }
    .ln    { stroke:#8b9bb0; stroke-width:1.5; fill:none; }
    .lnd   { stroke:#7f95b3; stroke-width:1.4; fill:none; stroke-dasharray:4 3; }
  </style>
  <rect class="bg" x="0" y="0" width="980" height="560"/>

  <text class="ttl" x="24" y="30">Pod 내부 — 무엇을 공유하고 무엇을 분리하는가</text>
  <text class="sub" x="24" y="48">Pod는 컨테이너가 아니라 "함께 배치되고 함께 살고 죽는 컨테이너 묶음"이다.</text>

  <!-- 노드 -->
  <rect class="node" x="24" y="66" width="640" height="470"/>
  <text class="zt" x="44" y="90">워커 노드 (호스트 커널을 공유)</text>

  <!-- Pod 박스 -->
  <rect class="podbx" x="48" y="106" width="592" height="330"/>
  <text class="n" x="68" y="130">Pod &#160;<tspan class="d">IP 10.244.1.5 · 호스트명 web-0</tspan></text>

  <!-- pause -->
  <rect class="pause" x="68" y="146" width="150" height="86"/>
  <text class="n" x="143" y="170" text-anchor="middle">pause 컨테이너</text>
  <text class="d" x="143" y="188" text-anchor="middle">네임스페이스를 소유</text>
  <text class="d" x="143" y="204" text-anchor="middle">좀비 프로세스 수거</text>
  <text class="d" x="143" y="220" text-anchor="middle">앱이 죽어도 IP 유지</text>

  <!-- 공유 네임스페이스 -->
  <rect class="share" x="236" y="146" width="384" height="86"/>
  <text class="tag" x="252" y="166">공유하는 네임스페이스</text>
  <text class="d" x="252" y="186">NET &#160;— 같은 IP, 같은 포트 공간. localhost 로 통신</text>
  <text class="d" x="252" y="204">IPC &#160;— 공유 메모리, 메시지 큐</text>
  <text class="d" x="252" y="222">UTS &#160;— 같은 호스트명</text>

  <!-- 컨테이너 A -->
  <rect class="ctr" x="68" y="252" width="256" height="112"/>
  <text class="n" x="196" y="276" text-anchor="middle">컨테이너 A (app)</text>
  <text class="tagx" x="84" y="298">각자 갖는 것</text>
  <text class="d" x="84" y="316">MNT — 자기만의 파일 시스템</text>
  <text class="d" x="84" y="333">PID &#160;— 자기가 PID 1</text>
  <text class="d" x="84" y="350">cgroup — 자기만의 CPU/메모리 한도</text>

  <!-- 컨테이너 B -->
  <rect class="ctr" x="344" y="252" width="276" height="112"/>
  <text class="n" x="482" y="276" text-anchor="middle">컨테이너 B (sidecar)</text>
  <text class="tagx" x="360" y="298">각자 갖는 것</text>
  <text class="d" x="360" y="316">MNT — 자기만의 파일 시스템</text>
  <text class="d" x="360" y="333">PID &#160;— 자기가 PID 1 (A의 프로세스는 안 보임)</text>
  <text class="d" x="360" y="350">cgroup — 자기만의 CPU/메모리 한도</text>

  <!-- 볼륨 -->
  <rect class="vol" x="68" y="382" width="552" height="40"/>
  <text class="n" x="344" y="399" text-anchor="middle">공유 볼륨 (emptyDir / PVC / ConfigMap …)</text>
  <text class="d" x="344" y="415" text-anchor="middle">파일은 자동으로 공유되지 않는다. 볼륨을 명시적으로 마운트해야 한다</text>

  <path class="lnd" d="M196 364 L196 382" />
  <path class="lnd" d="M482 364 L482 382" />

  <!-- pause ↔ 공유 -->
  <path class="ln" d="M218 189 L236 189" marker-end="url(#a3)"/>
  <path class="ln" d="M196 252 L196 232" marker-end="url(#a3)"/>
  <path class="ln" d="M482 252 L482 232" marker-end="url(#a3)"/>
  <text class="d" x="230" y="248">setns 로 합류</text>

  <!-- 커널 -->
  <rect class="ctr" x="48" y="452" width="592" height="60"/>
  <text class="n" x="344" y="476" text-anchor="middle">호스트 리눅스 커널</text>
  <text class="d" x="344" y="494" text-anchor="middle">namespaces · cgroups · capabilities · overlayfs · seccomp — 컨테이너를 이루는 실체</text>

  <!-- 오른쪽 요약 -->
  <rect class="ctr" x="688" y="106" width="268" height="180"/>
  <text class="n" x="822" y="130" text-anchor="middle">한 문장 요약</text>
  <text class="d" x="704" y="156">Pod =</text>
  <text class="d" x="704" y="176">&#160;&#160;NET · IPC · UTS 를 공유하고</text>
  <text class="d" x="704" y="194">&#160;&#160;MNT · PID 는 분리한</text>
  <text class="d" x="704" y="212">&#160;&#160;컨테이너 그룹</text>
  <text class="d" x="704" y="240">여기서 두 결론이 나온다:</text>
  <text class="d" x="704" y="258">① 같은 포트를 두 번 열 수 없다</text>
  <text class="d" x="704" y="276">② 파일은 볼륨으로만 공유된다</text>

  <rect class="ctr" x="688" y="306" width="268" height="130"/>
  <text class="n" x="822" y="330" text-anchor="middle">확인 방법</text>
  <text class="d" x="704" y="354">두 프로세스의 네임스페이스 비교</text>
  <text class="d" x="704" y="376" font-family="monospace">readlink /proc/&lt;pid&gt;/ns/net</text>
  <text class="d" x="704" y="394" font-family="monospace">readlink /proc/&lt;pid&gt;/ns/pid</text>
  <text class="d" x="704" y="416">inode 번호가 같으면 공유하는 것</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#8b9bb0"/>
    </marker>
  </defs>
</svg>
